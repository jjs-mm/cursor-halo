name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build for a release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Native integration and state tests
        run: ./scripts/test.sh
      - name: Build universal app
        if: matrix.arch == 'arm64'
        run: ./scripts/build.sh --universal
      - name: Build Intel app
        if: matrix.arch == 'x86_64'
        run: ./scripts/build.sh
      - name: Per-user installer smoke test
        timeout-minutes: 5
        run: ./scripts/smoke-install-macos.sh
      - name: Package universal app
        if: matrix.arch == 'arm64'
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'arm64'
        with:
          name: release-macos-universal
          path: |
            dist/CursorHalo-*-macos-universal.zip
            dist/CursorHalo-*-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows / ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            runtime: win-x64
          - runner: windows-11-arm
            runtime: win-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Core behavior tests
        shell: pwsh
        run: ./windows/scripts/test.ps1
      - name: Build and package
        shell: pwsh
        run: ./windows/scripts/build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Native window, hotkey, and rendering smoke test
        shell: pwsh
        run: ./windows/scripts/smoke.ps1 -Executable "./dist/windows/${{ matrix.runtime }}/app/CursorHalo.exe" -OutputDirectory "./.build/smoke/${{ matrix.runtime }}"
      - name: Per-user installer smoke test
        timeout-minutes: 5
        shell: pwsh
        run: ./windows/scripts/smoke-install.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-${{ matrix.runtime }}
          path: .build/smoke/${{ matrix.runtime }}
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.runtime }}
          path: |
            dist/CursorHalo-*-${{ matrix.runtime }}.zip
            dist/CursorHalo-*-${{ matrix.runtime }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux X11 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Native build and X11 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake g++ pkg-config libgtk-3-dev libx11-dev libxi-dev libxfixes-dev libxtst-dev libxext-dev librsvg2-common xvfb xauth xdotool openbox xcompmgr dbus-x11 python3
      - name: Native build and core tests
        run: ./linux/scripts/build.sh
      - name: Native overlay, input, shortcut, and focus smoke
        run: ./linux/scripts/smoke.sh .build/linux-${{ matrix.arch }}/cursor-halo .build/smoke/linux-${{ matrix.arch }}
      - name: Package Linux app
        run: ./linux/scripts/package.sh
      - name: Installer ownership, rollback, and user-state tests
        run: |
          python3 ./linux/scripts/test-install.py
          python3 ./linux/scripts/test-install.py --package ./dist/linux/linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-linux-${{ matrix.arch }}
          path: .build/smoke/linux-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/CursorHalo-*-linux-${{ matrix.arch }}.tar.gz
            dist/CursorHalo-*-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  gnome:
    name: GNOME 46 Wayland / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: GNOME Shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnome-shell gnome-shell-extension-prefs dbus-x11 xwayland gsettings-desktop-schemas libgl1-mesa-dri mesa-utils python3
      - name: Verify and record GNOME 46 environment
        run: python3 linux/scripts/record-gnome-environment.py 46 .build/smoke/gnome-${{ matrix.arch }}/environment.json
      - name: GNOME settings and behavior tests
        run: |
          node --version
          node --test linux/gnome/tests/model.test.js
      - name: Native GNOME Wayland extension smoke
        run: ./linux/gnome/tests/smoke.sh .build/smoke/gnome-${{ matrix.arch }}
      - name: Package GNOME extension
        if: matrix.arch == 'x64'
        run: ./linux/scripts/package-gnome.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-gnome-${{ matrix.arch }}
          path: .build/smoke/gnome-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'x64'
        with:
          name: release-gnome-shell
          path: |
            dist/CursorHalo-*-gnome-shell.zip
            dist/CursorHalo-*-gnome-shell.zip.sha256
          if-no-files-found: error
          retention-days: 14

  gnome-current:
    name: GNOME ${{ matrix.shell }} / Ubuntu ${{ matrix.distro }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            distro: '26.04'
            shell: '50'
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: '26.04'
            shell: '50'
          - runner: ubuntu-24.04
            arch: x64
            distro: '26.10'
            shell: '51'
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: '26.10'
            shell: '51'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Build pinned Ubuntu image and test native GNOME Wayland
        run: ./linux/scripts/test-gnome-container.sh '${{ matrix.distro }}' '.build/smoke/gnome-${{ matrix.shell }}-${{ matrix.arch }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-gnome-${{ matrix.shell }}-${{ matrix.arch }}
          path: .build/smoke/gnome-${{ matrix.shell }}-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14
