name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build for a release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Native integration and state tests
        run: ./scripts/test.sh
      - name: Build universal app
        if: matrix.arch == 'arm64'
        run: ./scripts/build.sh --universal
      - name: Build Intel app
        if: matrix.arch == 'x86_64'
        run: ./scripts/build.sh
      - name: Package universal app
        if: matrix.arch == 'arm64'
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'arm64'
        with:
          name: release-macos-universal
          path: |
            dist/CursorHalo-*-macos-universal.zip
            dist/CursorHalo-*-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows / ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            runtime: win-x64
          - runner: windows-11-arm
            runtime: win-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Core behavior tests
        shell: pwsh
        run: ./windows/scripts/test.ps1
      - name: Build and package
        shell: pwsh
        run: ./windows/scripts/build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Native window, hotkey, and rendering smoke test
        shell: pwsh
        run: ./windows/scripts/smoke.ps1 -Executable "./dist/windows/${{ matrix.runtime }}/app/CursorHalo.exe" -OutputDirectory "./.build/smoke/${{ matrix.runtime }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-${{ matrix.runtime }}
          path: .build/smoke/${{ matrix.runtime }}
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.runtime }}
          path: |
            dist/CursorHalo-*-${{ matrix.runtime }}.zip
            dist/CursorHalo-*-${{ matrix.runtime }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
